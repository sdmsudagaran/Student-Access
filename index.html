<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Report - Student Access</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cambridge: { DEFAULT: '#002147', light: '#1F3C64', accent: '#C5A059', bg: '#F8F5F0', darkgold: '#8b7340', danger: '#dc2626' }
                    },
                    fontFamily: { serif: ['"Playfair Display"', 'serif'], body: ['"Lora"', 'serif'] }
                }
            }
        }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        body { background-color: #F8F5F0; background-image: radial-gradient(#e0dcd3 1px, transparent 1px); background-size: 20px 20px; margin: 0; padding: 0; }
        .sudagaran-border { position: relative; }
        .sudagaran-border::before { content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; border: 1px solid #C5A059; pointer-events: none; border-radius: inherit; }
        .elegant-shadow { box-shadow: 0 10px 30px -5px rgba(0, 33, 71, 0.2); }
        .custom-input { width: 100%; padding: 0.75rem; background: transparent; border: 1px solid #1F3C64; color: #002147; border-radius: 0.25rem; font-family: 'Lora', serif; transition: all 0.3s; }
        .custom-input:focus { outline: none; border-color: #C5A059; box-shadow: 0 0 0 2px rgba(197, 160, 89, 0.2); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #F8F5F0; }
        ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a68444; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
        .toast-animate { animation: slideUp 0.3s ease-out forwards; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-cambridge font-body min-h-screen flex flex-col">
    <!-- Initial Loading Screen before React mounts -->
    <div id="root" class="flex-1 flex flex-col">
        <div style="display: flex; height: 100vh; align-items: center; justify-content: center; font-family: 'Lora', serif; color: #002147; flex-direction: column;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C5A059" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style="animation: spin 1s linear infinite; margin-bottom: 20px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
            <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 8px;">Loading Student Portal...</h2>
            <p style="opacity: 0.7; font-size: 0.9rem;">Connecting to database...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuration and Database URLs
        const ROSTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSax8yvoXLuG4PYYzCyKvaVt_wy0wPOOpVVlNbKjNWRijDLbtdlGewzkXfXR0o9yA1ndNzJuXvNTQbm/pub?gid=1746779222&single=true&output=csv";
        const DATA_MASUK_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSax8yvoXLuG4PYYzCyKvaVt_wy0wPOOpVVlNbKjNWRijDLbtdlGewzkXfXR0o9yA1ndNzJuXvNTQbm/pub?gid=94906687&single=true&output=csv";
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFlF_nYQvZIjrTMVSGgLlFP95lVzcySaHgBRTIxXvUT9_lzcyTVtQwVCHSzXe_KXw/exec";

        const chartColors = {
            phonic: { bg: 'rgba(0, 33, 71, 0.85)', border: '#002147' },       
            daily: { bg: 'rgba(197, 160, 89, 0.85)', border: '#C5A059' },    
            mec: { bg: 'rgba(31, 60, 100, 0.85)', border: '#1F3C64' },       
            cambridge: { bg: 'rgba(139, 115, 64, 0.85)', border: '#8b7340' } 
        };

        const Header = () => {
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <header className="bg-cambridge text-cambridge-bg p-4 flex justify-between items-center elegant-shadow sticky top-0 z-50">
                    <div className="flex items-center gap-4">
                        <img src="https://iili.io/C6Vdhes.th.png" alt="Logo Left" className="h-16 sm:h-20 w-auto object-contain bg-white rounded p-1.5 shadow-md" crossOrigin="anonymous"/>
                        <div>
                            <h1 className="font-serif text-xl sm:text-2xl font-bold tracking-wider text-cambridge-accent">PROGRESS REPORT</h1>
                            <p className="text-[10px] sm:text-xs tracking-widest uppercase opacity-80">Language Development Assessment</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-4 sm:gap-6">
                        <div className="text-right hidden sm:block">
                            <p className="font-serif font-bold text-cambridge-accent text-lg">{time.toLocaleTimeString('en-US')}</p>
                            <p className="text-xs tracking-wider uppercase">{time.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                        </div>
                        <img src="https://iili.io/C6V2ACl.th.png" alt="Logo Right" className="h-16 sm:h-20 w-auto object-contain bg-white rounded p-1.5 shadow-md" crossOrigin="anonymous"/>
                    </div>
                </header>
            );
        };

        const AIMotivationCard = ({ data }) => {
            const getMotivation = () => {
                const today = new Date();
                const currentDay = today.getDay();
                const diffToMonday = currentDay === 0 ? -6 : 1 - currentDay;
                const monday = new Date(today);
                monday.setDate(today.getDate() + diffToMonday);
                monday.setHours(0,0,0,0);

                let topicsCount = 0;
                data.forEach(d => {
                    const dDate = new Date(d.date);
                    if (!isNaN(dDate.getTime()) && dDate >= monday && dDate <= today) {
                        if (d.phonic && d.phonic.trim() !== '') topicsCount++;
                        if (d.dailyExpression && d.dailyExpression.trim() !== '') topicsCount++;
                        if (d.mec && d.mec.trim() !== '') topicsCount++;
                        if (d.cambridge && d.cambridge.trim() !== '') topicsCount++;
                    }
                });

                if (topicsCount === 0) return "Ready to learn? Your exciting educational journey for this week starts here. Let's make every day count!";
                if (topicsCount <= 3) return "Great start! You've successfully begun exploring new topics this week. Keep up this wonderful momentum!";
                if (topicsCount <= 6) return "Awesome progress! Your consistent effort is building a strong foundation. Stay curious and keep shining!";
                if (topicsCount <= 10) return "Outstanding work! You are showing incredible dedication to your studies. Keep reaching for the stars!";
                return "Phenomenal! You've mastered so many topics this week. Your passion for learning is truly inspiring!";
            };

            return (
                <div className="bg-gradient-to-r from-cambridge to-cambridge-light p-6 rounded-xl shadow-lg mb-8 text-white relative overflow-hidden">
                    <div className="relative z-10">
                        <h3 className="text-cambridge-accent font-bold uppercase tracking-widest text-xs mb-2 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="M4.93 19.07l2.83-2.83"/><path d="M16.24 7.76l2.83-2.83"/></svg>
                            AI Insights
                        </h3>
                        <p className="font-serif text-lg leading-relaxed">{getMotivation()}</p>
                    </div>
                    {/* Decorative Background Element */}
                    <div className="absolute -right-10 -top-10 opacity-10">
                        <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
                    </div>
                </div>
            );
        };

        const DailyChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (typeof window.Chart === 'undefined' || !chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                
                const todayStr = new Date().toDateString();
                const todayData = data.filter(d => d.date && new Date(d.date).toDateString() === todayStr);
                
                const phonicCount = todayData.filter(d => d.phonic && d.phonic.trim() !== '').length;
                const dailyCount = todayData.filter(d => d.dailyExpression && d.dailyExpression.trim() !== '').length;
                const mecCount = todayData.filter(d => d.mec && d.mec.trim() !== '').length;
                const cambridgeCount = todayData.filter(d => d.cambridge && d.cambridge.trim() !== '').length;

                chartInstance.current = new window.Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Phonic', 'Daily Exp', 'Talk w/ Hanna', 'Cambridge'],
                        datasets: [{
                            label: 'Topics Learned Today',
                            data: [phonicCount, dailyCount, mecCount, cambridgeCount],
                            backgroundColor: [chartColors.phonic.bg, chartColors.daily.bg, chartColors.mec.bg, chartColors.cambridge.bg],
                            borderColor: [chartColors.phonic.border, chartColors.daily.border, chartColors.mec.border, chartColors.cambridge.border],
                            borderWidth: 1, borderRadius: 6, barThickness: 30
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1, font: {family: "'Lora', serif"} }, grid: { color: 'rgba(0,0,0,0.05)' } },
                            x: { ticks: { font: {family: "'Lora', serif"} }, grid: { display: false } }
                        }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data]);
            return <div className="h-48 w-full"><canvas ref={chartRef}></canvas></div>;
        };

        const WeeklyChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (typeof window.Chart === 'undefined' || !chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                
                const weeklyPhonic = [0, 0, 0, 0, 0, 0];
                const weeklyDaily = [0, 0, 0, 0, 0, 0];
                const weeklyMec = [0, 0, 0, 0, 0, 0];
                const weeklyCambridge = [0, 0, 0, 0, 0, 0];
                
                const today = new Date();
                const currentDay = today.getDay();
                const diffToMonday = currentDay === 0 ? -6 : 1 - currentDay;
                const monday = new Date(today);
                monday.setDate(today.getDate() + diffToMonday);
                monday.setHours(0,0,0,0);

                data.forEach(d => {
                    if (!d.date) return;
                    const dateObj = new Date(d.date);
                    if(isNaN(dateObj.getTime())) return;
                    
                    if (dateObj >= monday && dateObj <= today) {
                        const day = dateObj.getDay();
                        if (day >= 1 && day <= 6) { 
                            const idx = day - 1;
                            if (d.phonic && d.phonic.trim() !== '') weeklyPhonic[idx]++;
                            if (d.dailyExpression && d.dailyExpression.trim() !== '') weeklyDaily[idx]++;
                            if (d.mec && d.mec.trim() !== '') weeklyMec[idx]++;
                            if (d.cambridge && d.cambridge.trim() !== '') weeklyCambridge[idx]++;
                        }
                    }
                });

                chartInstance.current = new window.Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                        datasets: [
                            { label: 'Phonic', data: weeklyPhonic, backgroundColor: chartColors.phonic.bg, borderColor: chartColors.phonic.border, borderWidth: 1, borderRadius: 4 },
                            { label: 'Daily Exp', data: weeklyDaily, backgroundColor: chartColors.daily.bg, borderColor: chartColors.daily.border, borderWidth: 1, borderRadius: 4 },
                            { label: 'Talk w/ Hanna', data: weeklyMec, backgroundColor: chartColors.mec.bg, borderColor: chartColors.mec.border, borderWidth: 1, borderRadius: 4 },
                            { label: 'Cambridge', data: weeklyCambridge, backgroundColor: chartColors.cambridge.bg, borderColor: chartColors.cambridge.border, borderWidth: 1, borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: true, position: 'bottom', labels: { font: {family: "'Lora', serif", size: 10}, boxWidth: 12 } } },
                        scales: {
                            y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1, font: {family: "'Lora', serif"} }, grid: { color: 'rgba(0,0,0,0.05)' } },
                            x: { stacked: true, ticks: { font: {family: "'Lora', serif"} }, grid: { display: false } }
                        }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data]);
            return <div className="h-48 w-full"><canvas ref={chartRef}></canvas></div>;
        };

        const DashboardView = ({ student, submittedData }) => {
            const studentData = submittedData.filter(d => d.name === student);

            const getWeeklyTableRows = () => {
                const rows = [];
                const today = new Date();
                const currentDay = today.getDay(); 
                const diffToMonday = currentDay === 0 ? -6 : 1 - currentDay;
                
                const monday = new Date(today);
                monday.setDate(today.getDate() + diffToMonday);
                
                for (let i = 0; i < 6; i++) {
                    const d = new Date(monday);
                    d.setDate(monday.getDate() + i);
                    const dateStr = d.toDateString();
                    
                    const entry = studentData.find(item => {
                        if(!item.date) return false;
                        return new Date(item.date).toDateString() === dateStr;
                    }) || {};
                    
                    rows.push({
                        dateObj: d,
                        dateStr: d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
                        phonic: entry.phonic,
                        dailyExpression: entry.dailyExpression,
                        mec: entry.mec,
                        cambridge: entry.cambridge
                    });
                }
                return rows;
            };

            const weeklyRows = getWeeklyTableRows();

            return (
                <div className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 fade-in">
                    <h2 className="text-2xl font-serif font-bold text-cambridge mb-6 border-b-2 border-cambridge-accent pb-2 inline-block">Welcome, {student}</h2>
                    
                    <AIMotivationCard data={studentData} />

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h3 className="font-serif text-lg font-bold text-cambridge border-b border-gray-100 pb-2 mb-4">Daily Recap (Today)</h3>
                            <DailyChart data={studentData} />
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <h3 className="font-serif text-lg font-bold text-cambridge border-b border-gray-100 pb-2 mb-4">Weekly Recap (Mon - Sat)</h3>
                            <WeeklyChart data={studentData} />
                        </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                        <h3 className="font-serif text-lg font-bold text-cambridge border-b border-gray-100 pb-2 mb-4">Weekly Progress Report</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[700px]">
                                <thead>
                                    <tr className="bg-gray-50 text-gray-600 text-[10px] uppercase tracking-wider">
                                        <th className="p-3 border-b border-gray-200 font-bold w-32">Date</th>
                                        <th className="p-3 border-b border-gray-200 font-bold">Phonic</th>
                                        <th className="p-3 border-b border-gray-200 font-bold">Daily Exp</th>
                                        <th className="p-3 border-b border-gray-200 font-bold">Talk with Hanna</th>
                                        <th className="p-3 border-b border-gray-200 font-bold">Cambridge</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {weeklyRows.map((row, i) => (
                                        <tr key={i} className="hover:bg-gray-50 transition">
                                            <td className="p-3 border-b border-gray-100 text-xs font-bold text-cambridge whitespace-nowrap align-top pt-4">{row.dateStr}</td>
                                            <td className="p-3 border-b border-gray-100 text-xs text-gray-700 align-top pt-4 leading-relaxed">{row.phonic || <span className="text-gray-300">-</span>}</td>
                                            <td className="p-3 border-b border-gray-100 text-xs text-gray-700 align-top pt-4 leading-relaxed">{row.dailyExpression || <span className="text-gray-300">-</span>}</td>
                                            <td className="p-3 border-b border-gray-100 text-xs text-gray-700 align-top pt-4 leading-relaxed">{row.mec || <span className="text-gray-300">-</span>}</td>
                                            <td className="p-3 border-b border-gray-100 text-xs text-gray-700 align-top pt-4 leading-relaxed">{row.cambridge || <span className="text-gray-300">-</span>}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const FeedbackView = ({ student, studentClass, submittedData, onFeedbackSubmit, isSubmitting }) => {
            const [feedbackText, setFeedbackText] = useState("");
            const isSaturday = new Date().getDay() === 6;

            const studentData = submittedData
                .filter(d => d.name === student && (d.feedback || d.mec))
                .sort((a,b) => {
                    const timeA = new Date(a.date).getTime();
                    const timeB = new Date(b.date).getTime();
                    return (!isNaN(timeA) && !isNaN(timeB)) ? timeB - timeA : 0;
                });

            return (
                <div className="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 fade-in">
                    
                    <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-6 text-center mb-8 shadow-sm sudagaran-border">
                        <p className="text-xs text-emerald-700 font-bold uppercase tracking-widest mb-1 opacity-80">Active Student</p>
                        <h2 className="text-3xl font-serif font-bold text-emerald-900 mb-3">{student}</h2>
                        <span className="bg-emerald-200 text-emerald-800 py-1 px-4 rounded-full text-xs font-bold uppercase tracking-wider">{studentClass}</span>
                    </div>

                    <div className="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200 mb-8 relative overflow-hidden">
                        <h3 className="font-serif text-xl font-bold text-cambridge mb-4 border-b border-gray-100 pb-2">Weekly Parents Feedback</h3>
                        
                        {!isSaturday && (
                            <div className="absolute inset-0 bg-gray-50/70 backdrop-blur-[2px] flex flex-col items-center justify-center z-10 rounded-xl">
                                <div className="bg-white p-6 rounded-xl shadow-xl text-center max-w-sm border border-gray-200">
                                    <svg xmlns="http://www.w3.org/2000/svg" className="w-10 h-10 text-gray-400 mx-auto mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                    <h4 className="font-bold text-gray-800 text-lg mb-2">Submission Locked</h4>
                                    <p className="text-sm text-gray-500 leading-relaxed">Feedback can only be submitted on Saturdays. Please return on Saturday to write your notes.</p>
                                </div>
                            </div>
                        )}

                        <textarea 
                            className="w-full p-4 border border-gray-300 rounded-lg text-sm focus:border-cambridge-accent focus:ring-2 focus:ring-cambridge-accent outline-none min-h-[140px] mb-4 bg-gray-50"
                            placeholder="Write your feedback regarding this week's progress..."
                            value={feedbackText}
                            onChange={(e) => setFeedbackText(e.target.value)}
                            disabled={!isSaturday || isSubmitting}
                        ></textarea>
                        
                        <div className="flex justify-end">
                            <button 
                                onClick={() => {
                                    if(feedbackText.trim()) {
                                        onFeedbackSubmit(feedbackText);
                                        setFeedbackText("");
                                    }
                                }}
                                disabled={!isSaturday || !feedbackText.trim() || isSubmitting}
                                className="bg-cambridge text-white font-bold py-3 px-8 rounded-lg hover:bg-cambridge-light disabled:opacity-50 disabled:cursor-not-allowed transition flex items-center justify-center gap-2 shadow-md w-full sm:w-auto"
                            >
                                {isSubmitting ? (
                                    <>
                                        <svg className="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                        Submitting...
                                    </>
                                ) : "Submit Feedback"}
                            </button>
                        </div>
                    </div>

                    <div className="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200">
                        <h3 className="font-serif text-xl font-bold text-cambridge mb-4 border-b border-gray-100 pb-2">Feedback & Interaction History</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-cambridge text-white font-serif">
                                        <th className="p-3 text-[10px] font-bold uppercase tracking-wider w-1/4 rounded-tl-lg">Date</th>
                                        <th className="p-3 text-[10px] font-bold uppercase tracking-wider w-3/4 rounded-tr-lg">Feedback</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {studentData.length > 0 ? studentData.map((d, i) => (
                                        <tr key={i} className="border-b border-gray-100 hover:bg-gray-50 transition">
                                            <td className="p-3 text-xs text-gray-600 align-top pt-4 whitespace-nowrap">
                                                {new Date(d.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}
                                            </td>
                                            <td className="p-3 text-sm text-gray-800 italic align-top pt-4 leading-relaxed">{d.feedback ? `"${d.feedback}"` : <span className="text-gray-300">-</span>}</td>
                                        </tr>
                                    )) : (
                                        <tr>
                                            <td colSpan="2" className="p-8 text-center text-gray-400 italic font-serif text-sm">No historical records found for this student.</td>
                                        </tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            )
        };

        const App = () => {
            const [view, setView] = useState('login'); 
            const [classesData, setClassesData] = useState({}); 
            const [submittedData, setSubmittedData] = useState([]);
            
            const [isLoading, setIsLoading] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [selectedClass, setSelectedClass] = useState("");
            const [selectedStudent, setSelectedStudent] = useState("");
            const [toast, setToast] = useState(null);

            const showToastMessage = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            useEffect(() => {
                // Fetch Classes & Roster
                Papa.parse(ROSTER_CSV_URL, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (!results || !results.data) {
                            showToastMessage("Failed to load Class Data", "error");
                            setIsLoading(false);
                            return;
                        }
                        const classMap = {};
                        results.data.forEach(row => {
                            if(!row) return;
                            let classKey, nameKey;
                            Object.keys(row).forEach(k => {
                                if (k.toLowerCase().includes('kelas') || k.toLowerCase().includes('class') || k.toLowerCase().includes('grade')) classKey = k;
                                if (k.toLowerCase().includes('nama') || k.toLowerCase().includes('name')) nameKey = k;
                            });

                            if (classKey && nameKey && row[classKey] && row[nameKey]) {
                                const className = row[classKey].trim();
                                const studentName = row[nameKey].trim();
                                if(!classMap[className]) classMap[className] = [];
                                classMap[className].push(studentName);
                            }
                        });
                        setClassesData(classMap);
                        setIsLoading(false);
                    },
                    error: () => {
                        setIsLoading(false);
                        showToastMessage("Database Connection Error", "error");
                    }
                });
            }, []);

            useEffect(() => {
                if (view !== 'login') {
                    Papa.parse(DATA_MASUK_CSV_URL, {
                        download: true,
                        header: false,
                        skipEmptyLines: true,
                        complete: (results) => {
                            if (!results || !results.data || results.data.length < 2) return;
                            
                            const headers = results.data[0].map(h => h ? h.toString().toLowerCase().trim() : '');
                            const getIdx = (keywords, defaultIdx) => {
                                const idx = headers.findIndex(h => keywords.some(kw => h.includes(kw)));
                                return idx !== -1 ? idx : defaultIdx;
                            };

                            const col = {
                                code: getIdx(['no', 'code', 'unik'], 0),
                                date: getIdx(['date', 'waktu', 'tanggal', 'time'], 1),
                                name: getIdx(['name', 'nama', 'student'], 2),
                                grade: getIdx(['grade', 'kelas', 'class'], 3),
                                phonic: getIdx(['phonic'], 4),
                                daily: getIdx(['daily', 'exp'], 5),
                                mec: getIdx(['mec'], 6),
                                cambridge: getIdx(['cambridge'], 7),
                                feedback: getIdx(['feedback', 'umpan', 'note'], 8)
                            };

                            const rows = results.data.slice(1); 
                            const fetchedData = [];
                            
                            rows.forEach(row => {
                                if (!Array.isArray(row)) return;
                                const nameVal = row[col.name];
                                if (nameVal && nameVal.trim() !== '') {
                                    fetchedData.push({
                                        code: row[col.code] || '', 
                                        date: row[col.date] || '', 
                                        name: nameVal.trim(), 
                                        grade: row[col.grade] || '',
                                        phonic: row[col.phonic] || '', 
                                        dailyExpression: row[col.daily] || '', 
                                        mec: row[col.mec] || '', 
                                        cambridge: row[col.cambridge] || '',
                                        feedback: row[col.feedback] ? row[col.feedback].trim() : ''
                                    });
                                }
                            });

                            setSubmittedData(fetchedData);
                        }
                    });
                }
            }, [view]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (selectedClass && selectedStudent) {
                    setView('dashboard');
                } else {
                    showToastMessage("Please select both Class and Student.", "error");
                }
            };

            const handleFeedbackSubmit = async (feedbackText) => {
                setIsSubmitting(true);
                const payload = [{
                    code: 'FBK-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                    date: new Date().toISOString(),
                    name: selectedStudent,
                    grade: selectedClass,
                    phonic: '',
                    dailyExpression: '',
                    mec: '',
                    cambridge: '',
                    feedback: feedbackText
                }];

                try {
                    await fetch(GOOGLE_APP_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload)
                    });
                    showToastMessage("Feedback submitted successfully!", "success");
                    setSubmittedData(prev => [...payload, ...prev]);
                } catch (error) {
                    showToastMessage("Network error while submitting feedback.", "error");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const renderLogin = () => {
                const studentsList = selectedClass ? (classesData[selectedClass] || []) : [];
                return (
                    <div className="flex-1 flex items-center justify-center p-6 fade-in">
                        <div className="bg-white p-10 rounded-xl elegant-shadow max-w-md w-full sudagaran-border">
                            <div className="text-center mb-8">
                                <div className="bg-cambridge text-white w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg border-4 border-cambridge-bg">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                                </div>
                                <h2 className="text-3xl font-serif font-bold text-cambridge">Students Access</h2>
                                <p className="text-sm opacity-70 mt-2">Please identify your session</p>
                            </div>
                            
                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-xs uppercase font-bold mb-2 tracking-wider text-gray-500">Class</label>
                                    <select className="custom-input" value={selectedClass} onChange={(e) => { setSelectedClass(e.target.value); setSelectedStudent(""); }} required disabled={isLoading}>
                                        <option value="" disabled>{isLoading ? "Loading classes..." : "Select class..."}</option>
                                        {Object.keys(classesData).map((cls, idx) => (
                                            <option key={idx} value={cls}>{cls}</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs uppercase font-bold mb-2 tracking-wider text-gray-500">Student Name</label>
                                    <select className="custom-input" value={selectedStudent} onChange={(e) => setSelectedStudent(e.target.value)} required disabled={!selectedClass}>
                                        <option value="" disabled>Select your name...</option>
                                        {studentsList.map((student, idx) => (
                                            <option key={idx} value={student}>{student}</option>
                                        ))}
                                    </select>
                                </div>
                                <button type="submit" className="w-full bg-cambridge text-white font-serif font-bold py-4 px-4 rounded-lg hover:bg-cambridge-light transition duration-300 flex items-center justify-center gap-2 mt-4 shadow-md">
                                    Enter Gateway 
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                                </button>
                            </form>
                        </div>
                    </div>
                );
            };

            const NavigationBar = () => {
                if (view === 'login') return null;
                return (
                    <div className="bg-white border-b border-gray-200 sticky top-[80px] sm:top-[88px] z-40 elegant-shadow">
                        <div className="max-w-6xl mx-auto px-4 flex justify-between items-center overflow-x-auto">
                            <div className="flex gap-2 sm:gap-8 min-w-max">
                                <button onClick={() => setView('dashboard')} className={`py-4 px-2 font-serif font-bold text-sm sm:text-base transition ${view==='dashboard' ? 'text-cambridge-accent border-b-2 border-cambridge-accent' : 'text-cambridge opacity-70 hover:opacity-100'}`}>Dashboard & Reports</button>
                                <button onClick={() => setView('feedback')} className={`py-4 px-2 font-serif font-bold text-sm sm:text-base transition ${view==='feedback' ? 'text-cambridge-accent border-b-2 border-cambridge-accent' : 'text-cambridge opacity-70 hover:opacity-100'}`}>Parents Feedback</button>
                            </div>
                            <button onClick={() => { setView('login'); setSelectedClass(''); setSelectedStudent(''); }} className="text-xs sm:text-sm text-red-600 hover:text-red-800 font-bold ml-4 whitespace-nowrap flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                Logout
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex-1 flex flex-col relative">
                    <Header />
                    <NavigationBar />
                    <main className="flex-1 flex flex-col relative">
                        {view === 'login' && renderLogin()}
                        {view === 'dashboard' && <DashboardView student={selectedStudent} submittedData={submittedData} />}
                        {view === 'feedback' && <FeedbackView student={selectedStudent} studentClass={selectedClass} submittedData={submittedData} onFeedbackSubmit={handleFeedbackSubmit} isSubmitting={isSubmitting} />}
                    </main>
                    
                    {toast && (
                        <div className={`fixed bottom-6 right-6 text-white px-6 py-4 rounded-lg shadow-2xl z-50 font-bold tracking-wide toast-animate flex items-center gap-3 ${toast.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>
                            {toast.type === 'success' && <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>}
                            {toast.type === 'error' && <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>}
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
