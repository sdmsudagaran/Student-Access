<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Report - Student Portal</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cambridge: { DEFAULT: '#002147', light: '#1F3C64', accent: '#C5A059', bg: '#F8F5F0', darkgold: '#8b7340', danger: '#dc2626' }
                    },
                    fontFamily: { serif: ['"Playfair Display"', 'serif'], body: ['"Lora"', 'serif'] }
                }
            }
        }
    </script>

    <!-- React & Libraries (Stable CDNs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body { background-color: #F8F5F0; background-image: radial-gradient(#e0dcd3 1px, transparent 1px); background-size: 20px 20px; margin: 0; padding: 0; }
        .sudagaran-border { position: relative; }
        .sudagaran-border::before { content: ''; position: absolute; top: 4px; left: 4px; right: 4px; bottom: 4px; border: 1px solid #C5A059; pointer-events: none; border-radius: inherit; }
        .elegant-shadow { box-shadow: 0 10px 30px -5px rgba(0, 33, 71, 0.2); }
        .custom-input { width: 100%; padding: 0.75rem; background: transparent; border: 1px solid #1F3C64; color: #002147; border-radius: 0.25rem; font-family: 'Lora', serif; transition: all 0.3s; }
        .custom-input:focus { outline: none; border-color: #C5A059; box-shadow: 0 0 0 2px rgba(197, 160, 89, 0.2); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #F8F5F0; }
        ::-webkit-scrollbar-thumb { background: #C5A059; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a68444; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { bottom: -50px; opacity: 0; } to { bottom: 20px; opacity: 1; } }
        .toast-animate { animation: slideUp 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-cambridge font-body min-h-screen flex flex-col">
    <!-- Initial Loading Screen -->
    <div id="root" class="flex-1 flex flex-col">
        <div style="display: flex; height: 100vh; align-items: center; justify-content: center; font-family: 'Lora', serif; color: #002147; flex-direction: column;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C5A059" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite; margin-bottom: 20px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
            <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 8px;">Loading Student Portal...</h2>
            <p style="opacity: 0.7; font-size: 0.9rem;">Connecting to class database...</p>
        </div>
    </div>
    <style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Data Sources
        const ROSTER_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSax8yvoXLuG4PYYzCyKvaVt_wy0wPOOpVVlNbKjNWRijDLbtdlGewzkXfXR0o9yA1ndNzJuXvNTQbm/pub?gid=1746779222&single=true&output=csv";
        const DATA_MASUK_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSax8yvoXLuG4PYYzCyKvaVt_wy0wPOOpVVlNbKjNWRijDLbtdlGewzkXfXR0o9yA1ndNzJuXvNTQbm/pub?gid=94906687&single=true&output=csv";
        const GOOGLE_APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzFlF_nYQvZIjrTMVSGgLlFP95lVzcySaHgBRTIxXvUT9_lzcyTVtQwVCHSzXe_KXw/exec";

        const chartColors = {
            phonic: { bg: 'rgba(0, 33, 71, 0.85)', border: '#002147' },       
            daily: { bg: 'rgba(197, 160, 89, 0.85)', border: '#C5A059' },    
            mec: { bg: 'rgba(31, 60, 100, 0.85)', border: '#1F3C64' },       
            cambridge: { bg: 'rgba(139, 115, 64, 0.85)', border: '#8b7340' } 
        };

        const Header = () => {
            const [time, setTime] = useState(new Date());

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            return (
                <header className="bg-cambridge text-cambridge-bg p-4 flex justify-between items-center elegant-shadow sticky top-0 z-50">
                    <div className="flex items-center gap-4">
                        <img src="https://iili.io/C6Vdhes.th.png" alt="Logo Left" className="h-14 sm:h-16 w-auto object-contain bg-white rounded p-1 shadow-md" crossOrigin="anonymous"/>
                        <div>
                            <h1 className="font-serif text-lg sm:text-2xl font-bold tracking-wider text-cambridge-accent">PROGRESS REPORT</h1>
                            <p className="text-[10px] sm:text-xs tracking-widest uppercase opacity-80">Language Development Assessment</p>
                        </div>
                    </div>
                    <div className="flex items-center gap-4 sm:gap-6">
                        <div className="text-right hidden sm:block">
                            <p className="font-serif font-bold text-cambridge-accent text-base sm:text-lg">{time.toLocaleTimeString('en-US')}</p>
                            <p className="text-[10px] sm:text-xs tracking-wider uppercase">{time.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                        </div>
                        <img src="https://iili.io/C6V2ACl.th.png" alt="Logo Right" className="h-14 sm:h-16 w-auto object-contain bg-white rounded p-1 shadow-md" crossOrigin="anonymous"/>
                    </div>
                </header>
            );
        };

        const DailyChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (typeof Chart === 'undefined' || !chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                
                const todayData = data.filter(d => {
                    if (!d.date) return false;
                    const dateObj = new Date(d.date);
                    return !isNaN(dateObj.getTime()) && dateObj.toDateString() === new Date().toDateString();
                });
                
                const phonicCount = todayData.filter(d => d.phonic && d.phonic.toString().trim() !== '').length;
                const dailyCount = todayData.filter(d => d.dailyExpression && d.dailyExpression.toString().trim() !== '').length;
                const mecCount = todayData.filter(d => d.mec && d.mec.toString().trim() !== '').length;
                const cambridgeCount = todayData.filter(d => d.cambridge && d.cambridge.toString().trim() !== '').length;

                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Phonic', 'Daily Exp', 'MEC', 'Cambridge'],
                        datasets: [{
                            label: 'Topics',
                            data: [phonicCount, dailyCount, mecCount, cambridgeCount],
                            backgroundColor: [chartColors.phonic.bg, chartColors.daily.bg, chartColors.mec.bg, chartColors.cambridge.bg],
                            borderColor: [chartColors.phonic.border, chartColors.daily.border, chartColors.mec.border, chartColors.cambridge.border],
                            borderWidth: 1, borderRadius: 6, barThickness: 28
                        }]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1, font: {family: "'Lora', serif"} }, grid: { color: 'rgba(0,0,0,0.05)' } },
                            x: { ticks: { font: {family: "'Lora', serif"} }, grid: { display: false } }
                        }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data]);

            return <div className="h-44 w-full"><canvas ref={chartRef}></canvas></div>;
        };

        const WeeklyChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (typeof Chart === 'undefined' || !chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                const weeklyPhonic = [0, 0, 0, 0, 0, 0];
                const weeklyDaily = [0, 0, 0, 0, 0, 0];
                const weeklyMec = [0, 0, 0, 0, 0, 0];
                const weeklyCambridge = [0, 0, 0, 0, 0, 0];
                
                const last7DaysData = data.filter(d => {
                    if (!d.date) return false;
                    const dateObj = new Date(d.date);
                    if(isNaN(dateObj.getTime())) return false;
                    const diffTime = Math.abs(new Date() - dateObj);
                    return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) <= 7;
                });

                last7DaysData.forEach(d => {
                    const day = new Date(d.date).getDay();
                    if (day >= 1 && day <= 6) { 
                        const idx = day - 1;
                        if (d.phonic && d.phonic.toString().trim() !== '') weeklyPhonic[idx]++;
                        if (d.dailyExpression && d.dailyExpression.toString().trim() !== '') weeklyDaily[idx]++;
                        if (d.mec && d.mec.toString().trim() !== '') weeklyMec[idx]++;
                        if (d.cambridge && d.cambridge.toString().trim() !== '') weeklyCambridge[idx]++;
                    }
                });

                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                        datasets: [
                            { label: 'Phonic', data: weeklyPhonic, backgroundColor: chartColors.phonic.bg, borderColor: chartColors.phonic.border, borderWidth: 1, borderRadius: 4 },
                            { label: 'Daily Exp', data: weeklyDaily, backgroundColor: chartColors.daily.bg, borderColor: chartColors.daily.border, borderWidth: 1, borderRadius: 4 },
                            { label: 'MEC', data: weeklyMec, backgroundColor: chartColors.mec.bg, borderColor: chartColors.mec.border, borderWidth: 1, borderRadius: 4 },
                            { label: 'Cambridge', data: weeklyCambridge, backgroundColor: chartColors.cambridge.bg, borderColor: chartColors.cambridge.border, borderWidth: 1, borderRadius: 4 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: true, position: 'bottom', labels: { font: {family: "'Lora', serif", size: 9}, boxWidth: 10 } } },
                        scales: {
                            y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1, font: {family: "'Lora', serif"} }, grid: { color: 'rgba(0,0,0,0.05)' } },
                            x: { stacked: true, ticks: { font: {family: "'Lora', serif"} }, grid: { display: false } }
                        }
                    }
                });
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, [data]);

            return <div className="h-44 w-full"><canvas ref={chartRef}></canvas></div>;
        };

        const AIMotivation = ({ studentName, studentData }) => {
            const [motivation, setMotivation] = useState("");
            const [isLoading, setIsLoading] = useState(false);

            useEffect(() => {
                const generateMotivation = async () => {
                    if (!studentData || studentData.length === 0) {
                        setMotivation("Keep learning and giving your best effort every day!");
                        return;
                    }

                    setIsLoading(true);
                    
                    // Count topics learned this week to give context to the AI
                    let phonicCount = 0, dailyCount = 0, mecCount = 0, cambridgeCount = 0;
                    studentData.forEach(d => {
                        if (d.phonic) phonicCount++;
                        if (d.dailyExpression) dailyCount++;
                        if (d.mec) mecCount++;
                        if (d.cambridge) cambridgeCount++;
                    });

                    const prompt = `Write a short, engaging 2-sentence motivational summary for a student named ${studentName}. 
                                  They have completed ${phonicCount} Phonics, ${dailyCount} Daily Expression, ${mecCount} MEC, and ${cambridgeCount} Cambridge topics this week. 
                                  Acknowledge their effort and encourage them to keep up the good work. Keep it very concise and positive.`;

                    try {
                        const apiKey = ""; // Canvas provides this automatically
                        if (!apiKey) {
                             // Fallback if no API key is provided
                             setMotivation(`Great job this week, ${studentName}! You've made progress across your subjects. Keep up the fantastic effort!`);
                             setIsLoading(false);
                             return;
                        }

                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: "You are a supportive and encouraging teacher writing a brief report card note." }] }
                        };

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        const result = await response.json();
                        if (result.candidates && result.candidates[0]?.content?.parts[0]?.text) {
                            setMotivation(result.candidates[0].content.parts[0].text.trim());
                        } else {
                            throw new Error("Invalid response");
                        }
                    } catch (error) {
                        console.error("Failed to generate AI motivation:", error);
                        setMotivation(`Keep up the great work, ${studentName}! Your dedication to learning is wonderful to see.`);
                    } finally {
                        setIsLoading(false);
                    }
                };

                generateMotivation();
            }, [studentName, studentData]);

            return (
                <div className="bg-gradient-to-r from-cambridge to-cambridge-light rounded-xl p-4 sm:p-6 mb-8 text-white shadow-lg relative overflow-hidden">
                    {/* Decorative Background Icon */}
                    <svg className="absolute -right-6 -top-6 w-32 h-32 text-white opacity-10 transform rotate-12" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    
                    <div className="relative z-10 flex flex-col gap-2">
                        <div className="flex items-center gap-2 mb-1">
                            <span className="bg-cambridge-accent text-cambridge text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider">AI Summary</span>
                            <h3 className="font-serif font-bold text-lg sm:text-xl text-cambridge-accent">Weekly Progress Insight</h3>
                        </div>
                        
                        {isLoading ? (
                            <div className="flex items-center gap-3 py-2">
                                <svg className="w-5 h-5 animate-spin text-cambridge-accent" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                <p className="text-sm italic opacity-80">Analyzing learning data...</p>
                            </div>
                        ) : (
                            <p className="font-body text-xs sm:text-sm leading-relaxed text-white/95 mt-1">{motivation}</p>
                        )}
                    </div>
                </div>
            );
        };

        const FeedbackView = ({ selectedStudent, selectedClass, feedbackList, setFeedbackList, showToastMessage }) => {
            const [feedbackInput, setFeedbackInput] = useState("");
            const [isSubmitting, setIsSubmitting] = useState(false);
            const isSaturday = new Date().getDay() === 6;

            const handleFeedbackSubmit = async (e) => {
                e.preventDefault();
                if(!feedbackInput.trim()) {
                    showToastMessage("Please enter feedback text.", "error");
                    return;
                }

                setIsSubmitting(true);
                
                const payload = {
                    code: 'FBK-' + Math.random().toString(36).substr(2, 6).toUpperCase(),
                    date: new Date().toISOString(),
                    name: selectedStudent,
                    grade: selectedClass,
                    phonic: '', 
                    dailyExpression: '', 
                    mec: '', 
                    cambridge: '',
                    feedback: feedbackInput 
                };

                try {
                    if (GOOGLE_APP_SCRIPT_URL) {
                        await fetch(GOOGLE_APP_SCRIPT_URL, {
                            method: 'POST', 
                            mode: 'no-cors', 
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload)
                        });
                    }
                    showToastMessage("Feedback saved successfully!", "success");
                    setFeedbackList(prev => [...prev, { name: selectedStudent, date: new Date().toISOString(), feedback: feedbackInput }]);
                    setFeedbackInput("");
                } catch (err) {
                    console.error("Save error:", err);
                    showToastMessage("Network error. Could not save feedback.", "error");
                }
                setIsSubmitting(false);
            };

            const studentFeedbacks = feedbackList.filter(f => f.name.toLowerCase() === selectedStudent.toLowerCase());

            return (
                <div className="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 fade-in">
                    <div className="bg-white rounded-xl shadow-lg border border-gray-100 overflow-hidden">
                        
                        {/* Student Badge Card */}
                        <div className="bg-emerald-50 border-b border-emerald-100 p-8 text-center flex flex-col items-center justify-center">
                            <p className="text-sm font-body text-gray-600 mb-1">Student:</p>
                            <h3 className="text-xl sm:text-2xl font-bold text-emerald-800 tracking-wide mb-3 uppercase">
                                {selectedStudent}
                            </h3>
                            <div className="inline-block bg-emerald-200 text-emerald-900 text-xs font-bold px-3 py-1 rounded">
                                {selectedClass}
                            </div>
                        </div>

                        <div className="p-6 sm:p-8">
                            {/* Parents Feedback Form Block */}
                            <div className="mb-10">
                                <h4 className="font-bold text-lg text-gray-800 mb-4 border-b pb-2 flex justify-between items-center">
                                    Weekly Learning Feedback
                                    {isSaturday ? (
                                        <span className="bg-green-100 text-green-800 text-[10px] font-bold px-2.5 py-1 rounded-full border border-green-300">
                                            Open Today
                                        </span>
                                    ) : (
                                        <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full border border-amber-300">
                                            Available Saturdays
                                        </span>
                                    )}
                                </h4>
                                
                                <form onSubmit={handleFeedbackSubmit} className="space-y-5">
                                    <div>
                                        <textarea 
                                            rows="5"
                                            className={`w-full p-4 rounded-lg border focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition-all text-sm font-body ${!isSaturday ? 'bg-gray-100 border-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white border-gray-300 text-gray-800'}`}
                                            placeholder={isSaturday ? "Example: My child showed great progress in Phonics this week..." : "Feedback form can only be submitted on Saturdays."}
                                            value={feedbackInput}
                                            onChange={(e) => setFeedbackInput(e.target.value)}
                                            disabled={!isSaturday || isSubmitting}
                                        ></textarea>
                                    </div>

                                    <button 
                                        type="submit" 
                                        disabled={!isSaturday || isSubmitting}
                                        className={`w-full py-3.5 rounded-lg font-bold text-sm transition-all duration-300 flex items-center justify-center gap-2 shadow-sm ${
                                            isSaturday && !isSubmitting 
                                            ? 'bg-emerald-600 text-white hover:bg-emerald-700 hover:shadow-md' 
                                            : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                                        }`}
                                    >
                                        {isSubmitting ? "Saving Feedback..." : "Save Feedback"}
                                    </button>
                                </form>
                            </div>

                            {/* Feedback History Table */}
                            <div>
                                <h4 className="font-bold text-lg text-gray-800 mb-4 border-b pb-2">Feedback History</h4>
                                <div className="bg-gray-50 border border-gray-200 rounded-lg overflow-hidden">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-gray-200/50 text-gray-600 text-xs uppercase font-bold border-b border-gray-200">
                                                <th className="p-4 w-1/3 border-r border-gray-200">Date</th>
                                                <th className="p-4">Parent's Notes</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {studentFeedbacks.length > 0 ? (
                                                studentFeedbacks.slice().reverse().map((item, idx) => (
                                                    <tr key={idx} className="border-b border-gray-200 text-sm hover:bg-white transition-colors">
                                                        <td className="p-4 font-semibold text-gray-700 border-r border-gray-200 whitespace-nowrap text-xs">
                                                            {item.date ? new Date(item.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'Recorded'}
                                                        </td>
                                                        <td className="p-4 text-gray-600 leading-relaxed text-sm">
                                                            {item.feedback}
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr>
                                                    <td colSpan="2" className="p-8 text-center text-gray-400 italic text-sm">
                                                        No feedback submitted yet for this student.
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login'); 
            const [classesData, setClassesData] = useState({}); 
            const [feedbackList, setFeedbackList] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            
            const [selectedClass, setSelectedClass] = useState("");
            const [selectedStudent, setSelectedStudent] = useState("");
            
            const [toast, setToast] = useState(null);
            const [submittedData, setSubmittedData] = useState([]);

            const showToastMessage = (msg, type = 'error') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Load Student Roster
            useEffect(() => {
                Papa.parse(ROSTER_CSV_URL, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (!results || !results.data) {
                            showToastMessage("Failed to load Class Data", "error");
                            setIsLoading(false);
                            return;
                        }
                        const classMap = {};
                        results.data.forEach(row => {
                            if(!row) return;
                            let classKey, nameKey;
                            Object.keys(row).forEach(k => {
                                if (k.toLowerCase().indexOf('kelas') !== -1 || k.toLowerCase().indexOf('class') !== -1 || k.toLowerCase().indexOf('grade') !== -1) classKey = k;
                                if (k.toLowerCase().indexOf('nama') !== -1 || k.toLowerCase().indexOf('name') !== -1) nameKey = k;
                            });

                            if (classKey && nameKey && row[classKey] && row[nameKey]) {
                                const className = row[classKey].trim();
                                const studentName = row[nameKey].trim();
                                if(!classMap[className]) classMap[className] = [];
                                classMap[className].push(studentName);
                            }
                        });
                        setClassesData(classMap);
                        setIsLoading(false);
                    },
                    error: (error) => {
                        console.error("PapaParse error:", error);
                        setIsLoading(false);
                        showToastMessage("Database Connection Error", "error");
                    }
                });
            }, []);

            // Load Ingestion Spreadsheet
            useEffect(() => {
                if (view !== 'login') {
                    Papa.parse(DATA_MASUK_CSV_URL, {
                        download: true,
                        header: false,
                        skipEmptyLines: true,
                        complete: (results) => {
                            if (!results || !results.data || results.data.length < 2) return;
                            
                            const rows = results.data.slice(1); 
                            const fetchedData = [];
                            const fetchedFb = [];
                            
                            rows.forEach(row => {
                                if (!Array.isArray(row)) return;
                                const nameVal = row[2]; // Column C (Student Name)
                                if (nameVal && nameVal.trim() !== '') {
                                    fetchedData.push({
                                        code: row[0] || '', 
                                        date: row[1] || '', 
                                        name: nameVal.trim(), 
                                        grade: row[3] || '',
                                        phonic: row[4] || '', 
                                        dailyExpression: row[5] || '', 
                                        mec: row[6] || '', 
                                        cambridge: row[7] || ''
                                    });
                                    // Ensure we accurately read column I (index 8) for feedback
                                    if (row[8] && row[8].trim() !== '') {
                                        fetchedFb.push({
                                            name: nameVal.trim(), 
                                            date: row[1] || '',
                                            feedback: row[8].trim() // Column I (Feedback)
                                        });
                                    }
                                }
                            });

                            setSubmittedData(fetchedData);
                            setFeedbackList(fetchedFb);
                        },
                        error: (error) => {
                            console.error("PapaParse Fetch Data Error:", error);
                        }
                    });
                }
            }, [view]);

            const handleLogin = (e) => {
                e.preventDefault();
                if (selectedClass && selectedStudent) {
                    setView('dashboard');
                } else {
                    showToastMessage("Please select both Class and Student Name.", "error");
                }
            };

            const NavigationBar = () => {
                if (view === 'login') return null;
                return (
                    <div className="bg-white border-b border-gray-200 sticky top-[80px] sm:top-[88px] z-40 elegant-shadow">
                        <div className="max-w-6xl mx-auto px-4 flex justify-between items-center overflow-x-auto">
                            <div className="flex gap-2 sm:gap-6 min-w-max">
                                <button onClick={() => setView('dashboard')} className={`py-3 sm:py-4 px-2 font-serif font-bold text-sm sm:text-base transition ${view==='dashboard' ? 'text-cambridge-accent border-b-2 border-cambridge-accent' : 'text-cambridge opacity-70 hover:opacity-100'}`}>Dashboard</button>
                                <button onClick={() => setView('feedback')} className={`py-3 sm:py-4 px-2 font-serif font-bold text-sm sm:text-base transition ${view==='feedback' ? 'text-cambridge-accent border-b-2 border-cambridge-accent' : 'text-cambridge opacity-70 hover:opacity-100'}`}>Parents Feedback</button>
                            </div>
                            <button onClick={() => { setView('login'); setSelectedStudent(""); }} className="text-xs sm:text-sm underline text-cambridge opacity-70 hover:text-cambridge-accent font-bold ml-4 whitespace-nowrap">
                                Change Student
                            </button>
                        </div>
                    </div>
                );
            };

            const renderLogin = () => (
                <div className="flex-1 flex items-center justify-center p-6 fade-in">
                    <div className="bg-white p-8 sm:p-10 rounded-lg elegant-shadow max-w-md w-full sudagaran-border">
                        <div className="text-center mb-8">
                            <img src="https://iili.io/C6Vdhes.th.png" alt="School Logo" className="h-20 w-auto mx-auto mb-3 object-contain" crossOrigin="anonymous"/>
                            <h2 className="text-2xl font-serif font-bold text-cambridge">Student Access</h2>
                            <p className="text-xs sm:text-sm opacity-70 mt-1">Please select your class and student profile</p>
                        </div>
                        
                        <form onSubmit={handleLogin} className="space-y-5">
                            <div>
                                <label className="block text-xs font-bold uppercase tracking-wider mb-2 text-cambridge">Class</label>
                                <select className="custom-input text-sm" value={selectedClass} onChange={(e) => { setSelectedClass(e.target.value); setSelectedStudent(""); }} required disabled={isLoading}>
                                    <option value="" disabled>{isLoading ? "Loading classes..." : "Select class..."}</option>
                                    {Object.keys(classesData).map((cls, idx) => (
                                        <option key={idx} value={cls}>{cls}</option>
                                    ))}
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-bold uppercase tracking-wider mb-2 text-cambridge">Student Name</label>
                                <select className="custom-input text-sm" value={selectedStudent} onChange={(e) => setSelectedStudent(e.target.value)} required disabled={!selectedClass}>
                                    <option value="" disabled>Select student name...</option>
                                    {(classesData[selectedClass] || []).map((student, idx) => (
                                        <option key={idx} value={student}>{student}</option>
                                    ))}
                                </select>
                            </div>
                            <button type="submit" className="w-full bg-cambridge text-white font-serif font-bold py-3 px-4 rounded hover:bg-cambridge-light transition duration-300 flex items-center justify-center gap-2 shadow-md">
                                Enter Gateway 
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                            </button>
                        </form>
                    </div>
                </div>
            );

            const renderDashboard = () => {
                const downloadDashboard = () => {
                    if (typeof html2canvas === 'undefined') {
                        showToastMessage("Export library is loading. Please try again.", "error");
                        return;
                    }
                    showToastMessage("Exporting dashboard image...", "success");
                    const dashboardElement = document.getElementById('dashboard-export-area');
                    
                    html2canvas(dashboardElement, { 
                        scale: 1.5, 
                        useCORS: true 
                    }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = `Progress_Report_${selectedStudent.replace(/\s+/g, '_')}_${new Date().getTime()}.png`;
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }).catch(err => {
                        console.error("Export failed:", err);
                        showToastMessage("Export failed. Please try again.", "error");
                    });
                };

                const studentData = submittedData.filter(d => d.name.toLowerCase() === selectedStudent.toLowerCase());
                
                // Start of current week (Monday)
                const getStartOfWeek = (date) => {
                    const d = new Date(date);
                    const day = d.getDay();
                    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
                    d.setDate(diff);
                    d.setHours(0,0,0,0);
                    return d;
                };

                const startOfWeek = getStartOfWeek(new Date());
                const endOfWeek = new Date(startOfWeek);
                endOfWeek.setDate(startOfWeek.getDate() + 5); 
                endOfWeek.setHours(23,59,59,999);

                const currentWeekData = studentData.filter(d => {
                    if(!d.date) return false;
                    const dDate = new Date(d.date);
                    return dDate >= startOfWeek && dDate <= endOfWeek;
                });

                const weekDays = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const tableData = weekDays.map((dayName, index) => {
                    const currentDate = new Date(startOfWeek);
                    currentDate.setDate(startOfWeek.getDate() + index);
                    
                    const dayData = currentWeekData.find(d => {
                        const dObj = new Date(d.date);
                        return dObj.toDateString() === currentDate.toDateString();
                    });
                    
                    const isFuture = currentDate > new Date();
                    return {
                        day: dayName,
                        date: currentDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                        isFuture: isFuture,
                        data: dayData || { phonic: '', dailyExpression: '', mec: '', cambridge: '' }
                    };
                });

                return (
                    <div className="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 fade-in">
                        <div className="flex justify-end mb-4">
                            <button onClick={downloadDashboard} className="bg-cambridge-accent text-cambridge font-bold px-4 py-2 rounded text-sm hover:bg-opacity-90 transition flex items-center gap-2 shadow-md">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                                Export PNG
                            </button>
                        </div>

                        <div id="dashboard-export-area" className="bg-[#F8F5F0] rounded-lg elegant-shadow sudagaran-border p-6 sm:p-8">
                            {/* Student Header */}
                            <div className="text-center mb-6 border-b-2 border-cambridge-accent pb-5">
                                <h2 className="text-2xl sm:text-3xl font-serif font-bold uppercase tracking-widest text-cambridge">Student Dashboard</h2>
                                <p className="text-base sm:text-lg mt-1 font-serif text-cambridge-light font-semibold">Student: {selectedStudent} | Class: {selectedClass}</p>
                            </div>

                            {/* AI Motivation Summary */}
                            <AIMotivation studentName={selectedStudent} studentData={studentData} />

                            {/* CHART DIAGRAMS (PLACED ON TOP AS REQUESTED) */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                                <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                                    <h3 className="font-serif text-base font-bold mb-3 text-cambridge border-b border-gray-100 pb-2">Daily Recap (Today)</h3>
                                    <DailyChart data={studentData} />
                                </div>
                                <div className="bg-white p-4 rounded-lg border border-gray-200 shadow-sm">
                                    <h3 className="font-serif text-base font-bold mb-3 text-cambridge border-b border-gray-100 pb-2">Weekly Recap (Mon - Sat)</h3>
                                    <WeeklyChart data={studentData} />
                                </div>
                            </div>

                            {/* WEEKLY PROGRESS TABLE */}
                            <div className="bg-white rounded-lg border border-gray-200 shadow-sm overflow-hidden">
                                <div className="bg-cambridge p-3">
                                    <h3 className="font-serif text-base sm:text-lg font-bold text-white text-center">Weekly Learning Report</h3>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[650px]">
                                        <thead>
                                            <tr className="bg-gray-100 border-b border-gray-200 text-cambridge text-xs uppercase tracking-wider font-bold">
                                                <th className="p-3 border-r">Date</th>
                                                <th className="p-3 border-r">Phonic</th>
                                                <th className="p-3 border-r">Daily Exp</th>
                                                <th className="p-3 border-r">MEC</th>
                                                <th className="p-3">Cambridge</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {tableData.map((row, idx) => (
                                                <tr key={idx} className={`border-b border-gray-100 text-sm ${row.isFuture ? 'bg-gray-50 opacity-60' : 'hover:bg-gray-50'}`}>
                                                    <td className="p-3 font-semibold text-cambridge whitespace-nowrap border-r">
                                                        <div>{row.day}</div>
                                                        <div className="text-[11px] text-gray-500 font-normal">{row.date}</div>
                                                    </td>
                                                    <td className="p-3 border-r">
                                                        {row.data.phonic ? <span className="bg-blue-50 text-blue-900 px-2 py-0.5 rounded font-medium text-xs">{row.data.phonic}</span> : <span className="text-gray-400 font-bold">-</span>}
                                                    </td>
                                                    <td className="p-3 border-r">
                                                        {row.data.dailyExpression ? <span className="bg-amber-50 text-amber-900 px-2 py-0.5 rounded font-medium text-xs">{row.data.dailyExpression}</span> : <span className="text-gray-400 font-bold">-</span>}
                                                    </td>
                                                    <td className="p-3 border-r">
                                                        {row.data.mec ? <span className="bg-indigo-50 text-indigo-900 px-2 py-0.5 rounded font-medium text-xs">{row.data.mec}</span> : <span className="text-gray-400 font-bold">-</span>}
                                                    </td>
                                                    <td className="p-3">
                                                        {row.data.cambridge ? <span className="bg-emerald-50 text-emerald-900 px-2 py-0.5 rounded font-medium text-xs">{row.data.cambridge}</span> : <span className="text-gray-400 font-bold">-</span>}
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            
                            <div className="mt-6 text-center text-[11px] opacity-60 font-serif">
                                Generated by Progress Report System | {new Date().toLocaleDateString('en-US', {day:'numeric', month:'short', year:'numeric'})}
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex-1 flex flex-col relative min-h-screen">
                    <Header />
                    <NavigationBar />
                    <main className="flex-1 flex flex-col bg-[#F8F5F0] relative pb-10">
                        {view === 'login' && renderLogin()}
                        {view === 'dashboard' && renderDashboard()}
                        {view === 'feedback' && (
                            <FeedbackView 
                                selectedStudent={selectedStudent} 
                                selectedClass={selectedClass} 
                                feedbackList={feedbackList} 
                                setFeedbackList={setFeedbackList} 
                                showToastMessage={showToastMessage} 
                            />
                        )}
                    </main>
                    {toast && (
                        <div className={`fixed bottom-6 right-6 text-white px-5 py-3 rounded-lg shadow-xl z-50 font-bold text-sm tracking-wide toast-animate flex items-center gap-2 ${toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`}>
                            {toast.msg}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
